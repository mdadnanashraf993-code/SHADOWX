<script>
"use strict";

const names = [
"CSV Cleaner",
"File Diff Checker",
"File Hash Calculator",
"JSON Validator",
"Bulk File Renamer",
"Folder File List Maker",
"Text to Binary Converter",
"Hexadecimal Converter",
"Cron Expression Checker",
"Chmod Permission Calculator",
"Regex Match Extractor",
"SQL Query Formatter",
"SQL Table Generator",
"HTML to JSX Converter",
"SVG Optimizer",
"Image to WebP Converter",
"Subtitle Synchronizer",
"VTT to SRT Converter",
"Robots.txt Generator",
"Sitemap XML Generator"
];

const desc = [
"Remove duplicate and blank CSV rows.",
"Compare two text files.",
"Calculate SHA-256 hash.",
"Validate JSON data.",
"Prepare bulk rename plan.",
"Create a list of files in a folder.",
"Convert text to binary.",
"Convert text and hexadecimal.",
"Check basic cron syntax.",
"Calculate Linux file permissions.",
"Extract regex matches.",
"Format SQL queries.",
"Generate SQL table statements.",
"Convert basic HTML to JSX.",
"Remove comments and extra SVG whitespace.",
"Convert images to WebP.",
"Shift subtitle timestamps.",
"Convert VTT subtitles to SRT.",
"Generate robots.txt.",
"Generate sitemap XML."
];

const grid = document.querySelector("#grid");
const modal = document.querySelector("#modal");
const form = document.querySelector("#form");
const out = document.querySelector("#out");

let active = 0;

names.forEach((name,i)=>{
const card = document.createElement("article");
card.className = "card";

const heading = document.createElement("h3");
heading.textContent = (i+1)+". "+name;

const paragraph = document.createElement("p");
paragraph.textContent = desc[i];

const button = document.createElement("button");
button.textContent = "Open Tool";
button.onclick = ()=>openTool(i);

card.append(heading,paragraph,button);
grid.append(card);
});

document.querySelector("#search").oninput = e=>{
[...grid.children].forEach(card=>{
card.style.display =
card.innerText.toLowerCase().includes(e.target.value.toLowerCase())
? "" : "none";
});
};

function field(label,id,type="textarea",extra=""){
if(type==="file"){
return `<div class="field">
<label>${label}</label>
<input id="${id}" type="file" ${extra}>
</div>`;
}

if(type==="textarea"){
return `<div class="field">
<label>${label}</label>
<textarea id="${id}" placeholder="${extra}"></textarea>
</div>`;
}

return `<div class="field">
<label>${label}</label>
<input id="${id}" type="${type}" placeholder="${extra}">
</div>`;
}

function openTool(i){
active=i;
document.querySelector("#title").textContent=names[i];
out.textContent="Your result appears here.";

let s="";

switch(i){

case 0:
s=field("CSV file","file","file",'accept=".csv"');
break;

case 1:
s=field("First text","a")+field("Second text","b");
break;

case 2:
s=field("Select file","file","file");
break;

case 3:
s=field("JSON text","json");
break;

case 4:
s=field("Select files","files","file","multiple")+
field("New base name","base","text","renamed")+
'<p class="hint">This tool prepares proposed names only. It does not rename original files.</p>';
break;

case 5:
s=field("Select folder","folder","file","webkitdirectory multiple");
break;

case 6:
case 7:
s=field("Text / encoded value","value")+
'<div class="field"><label>Direction</label><select id="dir"><option value="to">Encode</option><option value="from">Decode</option></select></div>';
break;

case 8:
s=field("Cron expression","cron","text","*/5 * * * *");
break;

case 9:
s=field("Octal permission","perm","text","755");
break;

case 10:
s=field("Text","txt")+
field("Regex","regex","text","[A-Za-z]+")+
field("Flags","flags","text","g");
break;

case 11:
s=field("SQL query","sql");
break;

case 12:
s=field("Table name","table","text","users")+
field("Columns (one per line: name TYPE)","cols");
break;

case 13:
s=field("HTML code","html");
break;

case 14:
s=field("SVG code","svg");
break;

case 15:
s=field("Image file","img","file",'accept="image/*"');
break;

case 16:
s=field("SRT content","srt")+
field("Shift seconds (+/-)","shift","number","2");
break;

case 17:
s=field("VTT content","vtt");
break;

case 18:
s=field("Website URL","site","text","https://example.com")+
field("Sitemap URL (optional)","map","text","https://example.com/sitemap.xml");
break;

case 19:
s=field("Full URLs, one per line","urls");
break;
}

form.innerHTML=s;
modal.style.display="block";
}

function value(id){
return document.getElementById(id)?.value || "";
}

function selectedFiles(id){
return [...(document.getElementById(id)?.files || [])];
}

function show(text){
out.textContent=text;
}

function downloadFile(name,data,type="text/plain"){
const blob=new Blob([data],{type});
const url=URL.createObjectURL(blob);
const link=document.createElement("a");

link.href=url;
link.download=name;
link.textContent="Download "+name;

out.innerHTML="";
out.append(link);

setTimeout(()=>URL.revokeObjectURL(url),60000);
}

function timeMilliseconds(t){
const m=t.match(/(\d{2}):(\d{2}):(\d{2}),(\d{3})/);
if(!m)return null;

return (
Number(m[1])*3600000+
Number(m[2])*60000+
Number(m[3])*1000+
Number(m[4])
);
}

function timestamp(n){
n=Math.max(0,n);

const h=Math.floor(n/3600000);
n%=3600000;

const m=Math.floor(n/60000);
n%=60000;

const s=Math.floor(n/1000);
const ms=n%1000;

return `${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")},${String(ms).padStart(3,"0")}`;
}

async function runTool(){

const runButton=document.querySelector("#run");
runButton.disabled=true;

try{

switch(active){

case 0:{
const file=selectedFiles("file")[0];
if(!file)throw Error("Choose a CSV file.");

const lines=(await file.text())
.replace(/^\uFEFF/,"")
.split(/\r?\n/);

const seen=new Set();

const clean=lines.filter(line=>{
if(!line.trim() || seen.has(line))return false;
seen.add(line);
return true;
});

downloadFile("cleaned.csv",clean.join("\r\n"),"text/csv");
break;
}

case 1:{
const a=value("a").split(/\r?\n/);
const b=value("b").split(/\r?\n/);
const result=[];

for(let i=0;i<Math.max(a.length,b.length);i++){
if(a[i]!==b[i]){
result.push(`Line ${i+1}: - ${a[i]??"(missing)"} / + ${b[i]??"(missing)"}`);
}
}

show(result.join("\n")||"No differences found.");
break;
}

case 2:{
const file=selectedFiles("file")[0];
if(!file)throw Error("Choose a file.");

if(!crypto.subtle)throw Error("SHA-256 requires HTTPS.");

const hash=await crypto.subtle.digest(
"SHA-256",
await file.arrayBuffer()
);

show([...new Uint8Array(hash)]
.map(x=>x.toString(16).padStart(2,"0"))
.join(""));
break;
}

case 3:{
const data=JSON.parse(value("json"));
show(JSON.stringify(data,null,2));
break;
}

case 4:{
const files=selectedFiles("files");
if(!files.length)throw Error("Choose files.");

const base=value("base")||"renamed";

show(files.map((file,i)=>{
const ext=file.name.includes(".")
?"."+file.name.split(".").pop():"";

return `${base}_${i+1}${ext}`;
}).join("\n")+
"\n\nThese are proposed names only. Original files are unchanged.");
break;
}

case 5:{
const files=selectedFiles("folder");
if(!files.length)throw Error("Choose a folder.");

downloadFile(
"folder-file-list.txt",
files.map(file=>file.webkitRelativePath||file.name).join("\n")
);
break;
}

case 6:
case 7:{
const text=value("value");

if(value("dir")==="to"){

const bytes=new TextEncoder().encode(text);

show([...bytes].map(byte=>
active===6
?byte.toString(2).padStart(8,"0")
:byte.toString(16).padStart(2,"0")
).join(" "));

}else{

const clean=text.trim().replace(/\s+/g,"");

const valid=active===6
?/^(?:[01]{8})+$/
:/^(?:[0-9a-f]{2})+$/i;

if(!valid.test(clean))throw Error("Invalid encoded input.");

const size=active===6?8:2;
const chunks=clean.match(new RegExp(`.{${size}}`,"g"));

const bytes=chunks.map(x=>parseInt(x,active===6?2:16));

show(new TextDecoder().decode(new Uint8Array(bytes)));
}
break;
}

case 8:{
const parts=value("cron").trim().split(/\s+/);
const valid=parts.length===5 &&
parts.every(x=>/^[\d*/?,\-]+$/.test(x));

show(valid
?"Basic five-field cron format looks okay. This is a syntax check only."
:"Invalid: use five fields (minute hour day month weekday).");
break;
}

case 9:{
const permission=value("perm");

if(!/^[0-7]{3,4}$/.test(permission))
throw Error("Enter octal digits such as 755.");

const number=parseInt(permission.slice(-3),8);
let result="";

for(const shift of [6,3,0]){
const digit=(number>>shift)&7;

result+=
(digit&4?"r":"-")+
(digit&2?"w":"-")+
(digit&1?"x":"-");
}

show(result);
break;
}

case 10:{
const regex=new RegExp(value("regex"),value("flags")||"g");
const matches=[...value("txt").matchAll(regex)];

show(matches.map(match=>match[0]).join("\n")||"No matches found.");
break;
}

case 11:{
const sql=value("sql").trim();
if(!sql)throw Error("Enter SQL.");

show(sql.replace(/\s+/g," ").replace(
/\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|INSERT INTO|VALUES|UPDATE|SET|DELETE FROM|JOIN|LEFT JOIN|RIGHT JOIN|INNER JOIN|ON)\b/gi,
"\n$1"
).trim());
break;
}

case 12:{
const table=value("table");
const columns=value("cols").split(/\r?\n/).map(x=>x.trim()).filter(Boolean);

if(!/^[A-Za-z_]\w*$/.test(table))
throw Error("Invalid table name.");

if(!columns.length ||
columns.some(x=>!/^[A-Za-z_]\w*\s+[A-Za-z][\w]*(?:\([\d, ]+\))?$/i.test(x))){
throw Error("Use columns like id INT or name VARCHAR(100).");
}

show(`CREATE TABLE ${table} (\n  ${columns.join(",\n  ")}\n);`);
break;
}

case 13:{
const html=value("html");

show(html
.replace(/\bclass=/g,"className=")
.replace(/\bfor=/g,"htmlFor=")
.replace(/<br\s*>/gi,"<br />")
.replace(/<hr\s*>/gi,"<hr />")
+"\n\nBasic conversion only. Check complex JSX manually.");
break;
}

case 14:{
const svg=value("svg");

const optimized=svg
.replace(/<!--[\s\S]*?-->/g,"")
.replace(/>\s+</g,"><")
.replace(/\s{2,}/g," ")
.trim();

if(!/<svg[\s>]/i.test(optimized))
throw Error("Paste valid SVG.");

downloadFile("optimized.svg",optimized,"image/svg+xml");
break;
}

case 15:{
const file=selectedFiles("img")[0];
if(!file)throw Error("Choose an image.");

const image=new Image();
const url=URL.createObjectURL(file);

image.onload=()=>{
try{
const canvas=document.createElement("canvas");
canvas.width=image.naturalWidth;
canvas.height=image.naturalHeight;

canvas.getContext("2d").drawImage(image,0,0);

canvas.toBlob(blob=>{
if(!blob){
show("WebP conversion unsupported in this browser.");
URL.revokeObjectURL(url);
return;
}

const convertedURL=URL.createObjectURL(blob);
const link=document.createElement("a");

link.href=convertedURL;
link.download="converted.webp";
link.textContent="Download converted.webp";

out.innerHTML="";
out.append(link);

setTimeout(()=>URL.revokeObjectURL(convertedURL),60000);
URL.revokeObjectURL(url);

},"image/webp",0.9);

}catch(error){
show("Conversion failed: "+error.message);
URL.revokeObjectURL(url);
}
};

image.onerror=()=>{
show("Could not load image.");
URL.revokeObjectURL(url);
};

image.src=url;
show("Converting image...");
break;
}

case 16:{
const text=value("srt");
const shift=Number(value("shift"))*1000;

if(!Number.isFinite(shift))
throw Error("Enter valid shift seconds.");

const result=text.replace(
/(\d{2}:\d{2}:\d{2},\d{3})\s*-->\s*(\d{2}:\d{2}:\d{2},\d{3})/g,
(match,start,end)=>{
return `${timestamp(timeMilliseconds(start)+shift)} --> ${timestamp(timeMilliseconds(end)+shift)}`;
}
);

downloadFile("shifted.srt",result);
break;
}

case 17:{
let text=value("vtt").replace(/^\uFEFF/,"");

text=text.replace(/^WEBVTT[^\n]*\r?\n?/,"");

text=text
.replace(/(\d{2}:\d{2}:\d{2})\.(\d{3})/g,"$1,$2")
.replace(/(\d{2}:\d{2})\.(\d{3})/g,"00:$1,$2");

let index=0;

const result=text.split(/\r?\n\r?\n/)
.filter(block=>block.trim())
.map(block=>block.includes("-->")
?`${++index}\n${block}`
:block)
.join("\n\n");

downloadFile("converted.srt",result);
break;
}

case 18:{
const site=value("site").trim();

if(!/^https?:\/\//i.test(site))
throw Error("Enter full website URL.");

const sitemap=value("map").trim()||
site.replace(/\/$/,"")+"/sitemap.xml";

downloadFile(
"robots.txt",
`User-agent: *\nAllow: /\nSitemap: ${sitemap}\n`
);
break;
}

case 19:{
const urls=value("urls")
.split(/\r?\n/)
.map(x=>x.trim())
.filter(Boolean);

if(!urls.length || urls.some(x=>!/^https?:\/\//i.test(x)))
throw Error("Enter full URLs, one per line.");

const escapeXML=text=>text
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;");

const xml=
'<?xml version="1.0" encoding="UTF-8"?>\n'+
'<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\n'+
urls.map(url=>`<url><loc>${escapeXML(url)}</loc></url>`).join("\n")+
'\n</urlset>';

downloadFile("sitemap.xml",xml,"application/xml");
break;
}

}

}catch(error){
show("Error: "+error.message);
}finally{
runButton.disabled=false;
}
}

document.querySelector("#run").onclick=runTool;

document.querySelector("#close").onclick=()=>{
modal.style.display="none";
};

document.querySelector("#clear").onclick=()=>{
form.querySelectorAll("input,textarea").forEach(input=>{
if(input.type==="file")input.value="";
else input.value="";
});

form.querySelectorAll("select").forEach(select=>{
select.selectedIndex=0;
});

show("Cleared.");
};

modal.addEventListener("click",event=>{
if(event.target===modal){
modal.style.display="none";
}
});

</script>
