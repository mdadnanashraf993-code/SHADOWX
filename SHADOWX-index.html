<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHADOWX TOOL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09000f;color:#fff;font-family:Arial,sans-serif}header{text-align:center;padding:30px 12px;border-bottom:1px solid #552078}.logo{display:inline-grid;place-items:center;width:54px;height:54px;border:2px solid #b44dff;border-radius:15px;color:#b44dff;font-size:24px;font-weight:bold;box-shadow:0 0 15px #a020f0;margin-bottom:10px}h1{color:#b44dff;text-shadow:0 0 15px #a020f0;margin:0}header p{color:#c9b5d8}#search{display:block;width:min(90%,600px);margin:25px auto;padding:13px 17px;border:1px solid #b44dff;border-radius:30px;background:#160b20;color:white;font-size:16px}.grid{width:92%;max-width:1200px;margin:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:17px}.card{background:#160b20;border:1px solid #552078;border-radius:14px;padding:20px}.card:hover{border-color:#b44dff;box-shadow:0 0 15px #7020a0;transform:translateY(-3px)}.card h3{color:#c45aff;margin:0 0 10px}.card p{color:#c9b5d8;font-size:14px;min-height:40px;line-height:1.4}button{border:0;border-radius:22px;padding:10px 17px;background:#8b2be2;color:white;font-weight:bold;cursor:pointer}button:hover{background:#b44dff}footer{text-align:center;margin-top:50px;padding:25px;border-top:1px solid #552078;background:#0d0314}footer p{font-weight:bold}.insta{display:inline-flex;align-items:center;gap:8px;color:#c45aff;text-decoration:none;font-weight:bold}small{display:block;color:#806c90;margin-top:15px}#modal{display:none;position:fixed;inset:0;z-index:9;overflow:auto;background:#000d;padding:15px}.dialog{max-width:750px;margin:25px auto;background:#160b20;border:1px solid #b44dff;border-radius:15px;padding:20px}.dialog h2{color:#c45aff}.close{float:right;background:#392047}.field{margin:12px 0}.field label{display:block;margin-bottom:6px;color:#dec8ee}textarea,input[type=text],input[type=number],select{width:100%;padding:11px;background:#09000f;color:white;border:1px solid #75409a;border-radius:8px}textarea{min-height:110px}input[type=file]{max-width:100%;color:white}.output{white-space:pre-wrap;overflow-wrap:anywhere;background:#09000f;border:1px solid #43205a;border-radius:8px;padding:12px;margin-top:15px;min-height:42px}.actions{display:flex;gap:10px;margin-top:12px}.hint{color:#bda6cc;font-size:13px}
</style></head><body>
<header><div class="logo">AS</div><h1>SHADOWX TOOL</h1><p>Welcome to Shadowx tool</p><p>Simple tools for files, text, coding and websites.</p></header>
<input id="search" placeholder="Search your tools..."><main id="grid" class="grid"></main>
<footer><p>MADE BY - Adnan Ashraf</p><a class="insta" href="https://www.instagram.com/adnanx249/" target="_blank" rel="noopener noreferrer"><svg width="25" height="25" viewBox="0 0 24 24" fill="currentColor"><path d="M7 2h10a5 5 0 0 1 5 5v10a5 5 0 0 1-5 5H7a5 5 0 0 1-5-5V7a5 5 0 0 1 5-5zm0 2a3 3 0 0 0-3 3v10a3 3 0 0 0 3 3h10a3 3 0 0 0 3-3V7a3 3 0 0 0-3-3H7zm5 3a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6z"/></svg>@adnanx249</a><small>© 2026 SHADOWX TOOL. All Rights Reserved.</small></footer>
<div id="modal"><div class="dialog"><button id="close" class="close">Close ✕</button><h2 id="title"></h2><div id="form"></div><div class="actions"><button id="run">Run Tool</button><button id="clear">Clear</button></div><div id="out" class="output">Your result appears here.</div></div></div>
<script>
const names=["CSV Cleaner","File Diff Checker","File Hash Calculator","JSON Validator","Bulk File Renamer","Folder File List Maker","Text to Binary Converter","Hexadecimal Converter","Cron Expression Checker","Chmod Permission Calculator","Regex Match Extractor","SQL Query Formatter","SQL Table Generator","HTML to JSX Converter","SVG Optimizer","Image to WebP Converter","Subtitle Synchronizer","VTT to SRT Converter","Robots.txt Generator","Sitemap XML Generator"];
const desc=["Remove blank and duplicate CSV rows.","Compare two text inputs line by line.","Calculate SHA-256 for a file.","Validate and format JSON.","Prepare numbered names for selected files.","Export a list of files in a folder.","Convert text to binary and back.","Convert text to hexadecimal and back.","Check basic five-field cron syntax.","Convert chmod octal permissions to symbols.","Extract matches using a regular expression.","Format a basic SQL query.","Generate a CREATE TABLE statement.","Convert common HTML attributes to JSX.","Minify SVG markup.","Convert an image to WebP.","Shift SRT subtitle timestamps.","Convert WebVTT subtitles to SRT.","Generate a robots.txt file.","Generate a sitemap.xml file."];
const grid=document.querySelector('#grid'),modal=document.querySelector('#modal'),form=document.querySelector('#form'),out=document.querySelector('#out');let active=0;
names.forEach((n,i)=>{let c=document.createElement('article');c.className='card';c.innerHTML=`<h3>${i+1}. ${n}</h3><p>${desc[i]}</p><button>Open Tool</button>`;c.querySelector('button').onclick=()=>open(i);grid.append(c)});
document.querySelector('#search').oninput=e=>[...grid.children].forEach(c=>c.style.display=c.innerText.toLowerCase().includes(e.target.value.toLowerCase())?'':'none');
function f(label,id,type='textarea',extra=''){return `<div class="field"><label>${label}</label>${type==='file'?`<input id="${id}" type="file" ${extra}>`:type==='textarea'?`<textarea id="${id}" placeholder="${extra}"></textarea>`:`<input id="${id}" type="${type}" placeholder="${extra}">`}</div>`}
function open(i){active=i;document.querySelector('#title').textContent=names[i];out.textContent='Your result appears here.';let s='';
switch(i){case 0:s=f('CSV file','file','file','accept=".csv"');break;case 1:s=f('First text','a')+f('Second text','b');break;case 2:s=f('Select file','file','file');break;case 3:s=f('JSON text','json');break;case 4:s=f('Select files','files','file','multiple')+f('New base name','base','text','renamed')+'<p class="hint">Browser security does not allow renaming original files directly; this tool lists proposed names.</p>';break;case 5:s=f('Select folder','folder','file','webkitdirectory multiple');break;case 6:case 7:s=f('Text / encoded value','value')+`<div class="field"><label>Direction</label><select id="dir"><option value="to">Encode</option><option value="from">Decode</option></select></div>`;break;case 8:s=f('Cron expression','cron','text','*/5 * * * *');break;case 9:s=f('Octal permission','perm','text','755');break;case 10:s=f('Text','txt')+f('Regex','regex','text','[A-Za-z]+')+f('Flags','flags','text','g');break;case 11:s=f('SQL query','sql');break;case 12:s=f('Table name','table','text','users')+f('Columns (one per line: name TYPE)','cols');break;case 13:s=f('HTML code','html');break;case 14:s=f('SVG code','svg');break;case 15:s=f('Image file','img','file','accept="image/*"');break;case 16:s=f('SRT content','srt')+f('Shift seconds (+/-)','shift','number','2');break;case 17:s=f('VTT content','vtt');break;case 18:s=f('Website URL','site','text','https://example.com')+f('Sitemap URL (optional)','map','text','https://example.com/sitemap.xml');break;case 19:s=f('Full URLs, one per line','urls');break}
form.innerHTML=s;modal.style.display='block'}
function v(id){return document.getElementById(id)?.value||''}function files(id){return [...(document.getElementById(id)?.files||[])]}
function show(s){out.textContent=s}function dl(name,data,type='text/plain'){let a=document.createElement('a'),u=URL.createObjectURL(new Blob([data],{type}));a.href=u;a.download=name;a.textContent='Download '+name;out.innerHTML='';out.append(a);setTimeout(()=>URL.revokeObjectURL(u),60000)}
function msTime(t){let m=t.match(/(\d\d):(\d\d):(\d\d),(\d{3})/);return m?((+m[1]*3600+ +m[2]*60+ +m[3])*1000+ +m[4]):null}function stamp(n){n=Math.max(0,n);let h=Math.floor(n/3600000);n%=3600000;let m=Math.floor(n/60000);n%=60000;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(Math.floor(n/1000)).padStart(2,'0')},${String(n%1000).padStart(3,'0')}`}
async function run(){try{switch(active){
case 0:{let a=files('file')[0];if(!a)throw Error('Choose a CSV file.');let lines=(await a.text()).replace(/^\uFEFF/,'').split(/\r?\n/),seen=new Set(),clean=lines.filter(x=>x.trim()&&!seen.has(x)&&(seen.add(x),true));dl('cleaned.csv',clean.join('\r\n'),'text/csv');break}
case 1:{let a=v('a').split(/\r?\n/),b=v('b').split(/\r?\n/),r=[];for(let i=0;i<Math.max(a.length,b.length);i++)if(a[i]!==b[i])r.push(`Line ${i+1}: - ${a[i]??'(missing)'} / + ${b[i]??'(missing)'}`);show(r.join('\n')||'No differences found.');break}
case 2:{let a=files('file')[0];if(!a)throw Error('Choose a file.');if(!crypto.subtle)throw Error('SHA-256 requires HTTPS.');let h=await crypto.subtle.digest('SHA-256',await a.arrayBuffer());show([...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join(''));break}
case 3:show(JSON.stringify(JSON.parse(v('json')),null,2));break;
case 4:{let a=files('files');if(!a.length)throw Error('Choose files.');let b=v('base')||'renamed';show(a.map((x,i)=>`${b}_${i+1}${x.name.includes('.')?'.'+x.name.split('.').pop():''}`).join('\n')+'\n\nThese are proposed names only; browser security prevents changing originals.');break}
case 5:{let a=files('folder');if(!a.length)throw Error('Choose a folder.');dl('folder-file-list.txt',a.map(x=>x.webkitRelativePath||x.name).join('\n'));break}
case 6:case 7:{let s=v('value');if(v('dir')==='to'){let b=new TextEncoder().encode(s);show([...b].map(x=>active===6?x.toString(2).padStart(8,'0'):x.toString(16).padStart(2,'0')).join(' '))}else{let t=s.trim().replace(/\s+/g,'');let re=active===6?/^(?:[01]{8})+$/:/^(?:[0-9a-f]{2})+$/i;if(!re.test(t))throw Error('Invalid encoded input.');let arr=t.match(/.{2,8}/g).map(x=>parseInt(x,active===6?2:16));show(new TextDecoder().decode(new Uint8Array(arr)))}break}
case 8:{let p=v('cron').trim().split(/\s+/);show(p.length===5&&p.every(x=>/^[\\d*/?,\\-]+$/.test(x))?'Basic five-field cron format looks okay.':'Invalid: use five fields (minute hour day month weekday).');break}
case 9:{let s=v('perm');if(!/^[0-7]{3,4}$/.test(s))throw Error('Enter octal digits such as 755.');let n=parseInt(s.slice(-3),8),r='';for(let x of [6,3,0]){let q=n>>x&7;r+=(q&4?'r':'-')+(q&2?'w':'-')+(q&1?'x':'-')}show(r);break}
case 10:{let re=new RegExp(v('regex'),v('flags')||'g'),m=[...v('txt').matchAll(re)];show(m.map(x=>x[0]).join('\n')||'No matches found.');break}
case 11:{let s=v('sql').trim();if(!s)throw Error('Enter SQL.');show(s.replace(/\s+/g,' ').replace(/\b(SELECT|FROM|WHERE|GROUP BY|ORDER BY|HAVING|LIMIT|INSERT INTO|VALUES|UPDATE|SET|DELETE FROM|JOIN|LEFT JOIN|RIGHT JOIN|INNER JOIN|ON)\b/gi,'\n$1').trim());break}
case 12:{let t=v('table'),c=v('cols').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);if(!/^[A-Za-z_]\\w*$/.test(t)||!c.length||c.some(x=>!/^[A-Za-z_]\\w*\\s+[A-Za-z][\\w]*(?:\\([\\d, ]+\\))?$/i.test(x)))throw Error('Use table name and columns like id INT, name VARCHAR(100).');show(`CREATE TABLE ${t} (\\n  ${c.join(',\\n  ')}\\n);`);break}
case 13:show(v('html').replace(/\bclass=/g,'className=').replace(/\bfor=/g,'htmlFor=').replace(/<br\\s*>/gi,'<br />').replace(/<hr\\s*>/gi,'<hr />')+'\n\nBasic conversion only; check complex JSX manually.');break;
case 14:{let s=v('svg').replace(/<!--[\\s\\S]*?-->/g,'').replace(/>\\s+</g,'><').replace(/\\s{2,}/g,' ').trim();if(!/<svg[\\s>]/i.test(s))throw Error('Paste valid SVG.');dl('optimized.svg',s,'image/svg+xml');break}
case 15:{let a=files('img')[0];if(!a)throw Error('Choose an image.');let im=new Image(),u=URL.createObjectURL(a);im.onload=()=>{let c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;c.getContext('2d').drawImage(im,0,0);c.toBlob(b=>{if(!b){show('WebP conversion unsupported in this browser.');return}let link=document.createElement('a'),z=URL.createObjectURL(b);link.href=z;link.download='converted.webp';link.textContent='Download converted.webp';out.innerHTML='';out.append(link);URL.revokeObjectURL(u)},'image/webp',.9)};im.onerror=()=>show('Could not load image.');im.src=u;show('Converting...');break}
case 16:{let s=v('srt'),d=Number(v('shift'))*1000;if(!Number.isFinite(d))throw Error('Enter shift seconds.');let r=s.replace(/(\\d{2}:\\d{2}:\\d{2},\\d{3})\\s*-->\\s*(\\d{2}:\\d{2}:\\d{2},\\d{3})/g,(m,a,b)=>`${stamp(msTime(a)+d)} --> ${stamp(msTime(b)+d)}`);dl('shifted.srt',r);break}
case 17:{let s=v('vtt').replace(/^\\uFEFF?WEBVTT[^\\n]*\\n?/,'').replace(/(\\d{2}:\\d{2}:\\d{2})\\.(\\d{3})/g,'$1,$2').replace(/(\\d{2}:\\d{2})\\.(\\d{3})/g,'00:$1,$2'),i=0,r=s.split(/\\r?\\n\\r?\\n/).filter(Boolean).map(b=>b.includes('-->')?`${++i}\\n${b}`:b).join('\\n\\n');dl('converted.srt',r);break}
case 18:{let s=v('site').trim();if(!/^https?:\\/\\//i.test(s))throw Error('Enter full website URL.');dl('robots.txt',`User-agent: *\\nAllow: /\\nSitemap: ${v('map').trim()||s.replace(/\\/$/,'')+'/sitemap.xml'}\\n`);break}
case 19:{let a=v('urls').split(/\\r?\\n/).map(x=>x.trim()).filter(Boolean);if(!a.length||a.some(x=>!/^https?:\\/\\//i.test(x)))throw Error('Enter full URLs, one per line.');let esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');dl('sitemap.xml','<?xml version="1.0" encoding="UTF-8"?>\\n<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">\\n'+a.map(x=>`<url><loc>${esc(x)}</loc></url>`).join('\\n')+'\\n</urlset>','application/xml');break}
}}catch(e){show('Error: '+e.message)}}
document.querySelector('#run').onclick=run;document.querySelector('#close').onclick=()=>modal.style.display='none';document.querySelector('#clear').onclick=()=>{form.querySelectorAll('input,textarea').forEach(x=>x.value='');show('Cleared.')};
</script></body></html>
